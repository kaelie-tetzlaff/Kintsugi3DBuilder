####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-jvm-community
profile:
  path: .idea/inspectionProfiles/
include:
  - name: CheckDependencyLicenses
inspections:
  - group: ALL
    ignore:
      - "scope#file:src/test/resources//*"
      - "scope#file:target/generated-sources//*"
      - "scope#file:target/generated-test-sources//*"
      - "scope#file:*/target//*"
      - "scope#file[sjm-ply]:*//*"
      - "scope#file:lib//*"
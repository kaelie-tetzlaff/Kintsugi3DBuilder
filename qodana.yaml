####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-jvm-community
# Use different entry points for Qodana to explicitly target @FXML annotated fields and methods, which aren't recognized correctly by Qodana:
bootstrap: cp .qodana/misc.xml .idea/misc.xml
profile:
  path: .idea/inspectionProfiles/Project_Default.xml
  inspections:
    - group: ALL
      ignore:
        - "scope#file:*/src/test/resources//*"
        - "scope#file:*/target//*"   # covers generated-sources & generated-test-sources everywhere
        - "scope#file:*/assembly//*"
        - "scope#file[sjm-ply]:*//*" # sjm-ply library has been incorporated into the repository without modification.
        - "scope#file:lib//*"
        # copied from Michael Ludwig's ferox project with almost no modification:
        - "scope#file:gl/src/main/java/kintsugi3d/gl/util/RadianceImageLoader*"
    - inspection: XmlUnboundNsPrefix
      ignore:
        - "**/*.fxml" # Suppress warnings about the XML namespace for FXML files.
    - inspection: MethodMayBeStatic
      ignore:
        - "scope#file:fx/src/main/java/kintsugi3d/fx/controllers//*" # Suppress warnings about marking methods static for JavaFX controllers.
failureConditions:
  severityThresholds:
    critical: 0   # any Critical problem (ERROR) fails the build job
    high: 0       # any High (WARNING) fails the build job